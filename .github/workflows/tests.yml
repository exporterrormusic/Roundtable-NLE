# ROUNDTABLE — CI Tests
#
# Trigger: every push to main and every pull request.
#
# What it does:
#   1. Orphan-source guardrail (now covers tests/ too — a test .cpp whose stem
#      is registered in no CMakeLists is dead code and fails the build).
#   2. Configures + builds the whole project WITH tests (-DROUNDTABLE_BUILD_TESTS=ON).
#      Building every test target is itself a guardrail: it catches tests that
#      bit-rot against the live API (the reason the suite had silently gone red).
#   3. Runs the "core" ctest label — the deterministic, headless-safe group.
#      GPU/UI tests need a real Vulkan device / display, so they are built
#      (compile coverage) but not executed on the headless runner.

name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # windows-latest moved to Visual Studio 2026; the project builds with
    # Visual Studio 2022 (generator "Visual Studio 17 2022").
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v2

      # Qt and the bundled CMake are not in git (third_party/qt/ and
      # tools/cmake/ are ignored), so install the versions the build expects.
      # Qt lands in third_party/Qt/6.8.3/msvc2022_64; Windows paths are
      # case-insensitive, so the third_party/qt/... paths below resolve.
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: '${{ github.workspace }}/third_party'
          cache: true

      - name: Install CMake 3.31.6
        uses: lukka/get-cmake@v3.31.6

      # Only FFmpeg's headers are in git (*.lib and *.dll are ignored). Add
      # the import libraries and DLLs of the matching BtbN 7.1 LGPL shared
      # build (local copy: n7.1.3-40; this is the nearest one BtbN keeps).
      - name: Fetch FFmpeg 7.1 libraries
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-02-28-12-59/ffmpeg-n7.1.3-42-g39ee683e8f-win64-lgpl-shared-7.1.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $out
          $src = (Get-ChildItem $out -Directory | Select-Object -First 1).FullName
          $dest = "${{ github.workspace }}\third_party\ffmpeg"
          New-Item -ItemType Directory -Force "$dest\bin" | Out-Null
          Copy-Item "$src\lib\*.lib" "$dest\lib" -Force
          Copy-Item "$src\bin\*.dll" "$dest\bin" -Force
          Get-ChildItem "$dest\lib\*.lib", "$dest\bin\*.dll" | ForEach-Object Name

      - name: Check for orphan source files (src/ + tests/)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check_orphans.ps1

      - name: Check for banned path::string() call sites
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check_path_string.ps1

      - name: Configure CMake (with tests)
        shell: pwsh
        run: |
          # Use bundled cmake (3.31.6+) — required by FetchContent sub-builds.
          $cmake = Get-ChildItem "${{ github.workspace }}\tools\cmake\cmake-*\bin\cmake.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $cmake) { $cmake = "cmake" }
          $cmakeDir = Split-Path -Parent $cmake
          $env:PATH = "${cmakeDir};${env:PATH}"
          & $cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -DCMAKE_BUILD_TYPE=Release `
            -DROUNDTABLE_BUILD_TESTS=ON `
            -DROUNDTABLE_ENABLE_WHISPER_CUDA=OFF `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\third_party\qt\6.8.3\msvc2022_64"

      - name: Build (all targets — compile coverage for the whole test suite)
        shell: pwsh
        run: |
          $cmake = Get-ChildItem "${{ github.workspace }}\tools\cmake\cmake-*\bin\cmake.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $cmake) { $cmake = "cmake" }
          $cmakeDir = Split-Path -Parent $cmake
          $env:PATH = "${cmakeDir};${env:PATH}"
          & $cmake --build build --config Release --parallel

      - name: Run core tests (deterministic, headless-safe)
        shell: pwsh
        run: |
          $ctest = Get-ChildItem "${{ github.workspace }}\tools\cmake\cmake-*\bin\ctest.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $ctest) { $ctest = "ctest" }
          & $ctest --test-dir build -C Release -L core --output-on-failure

      - name: Run hardened export regressions (fast, headless-safe)
        shell: pwsh
        run: |
          $test = Join-Path "${{ github.workspace }}" "build/bin/Release/test_export.exe"
          & $test "--gtest_filter=ExportRenderQueue.FullSnapshot*:ExportIntegrity.*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
