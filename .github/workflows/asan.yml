# ROUNDTABLE — AddressSanitizer test run
#
# Builds the core test suite with -DROUNDTABLE_ASAN=ON (MSVC
# /fsanitize=address) and runs the headless "core" ctest label.  Catches the
# heap-corruption / use-after-free class of bugs (the 0xC0000374 family) at
# the faulting instruction with a full report, instead of a deferred ntdll
# fast-fail with no stack.
#
# Trigger: manual (workflow_dispatch) + weekly.  Not on every push — the
# ASan build is slow and the run is a sweep, not a gate.  Promote it to a
# PR gate once it has a clean track record.

name: ASan Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

jobs:
  asan:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (tests + ASan)
        shell: pwsh
        run: |
          $cmake = Get-ChildItem "${{ github.workspace }}\tools\cmake\cmake-*\bin\cmake.exe" |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $cmake) { $cmake = "cmake" }
          $cmakeDir = Split-Path -Parent $cmake
          $env:PATH = "${cmakeDir};${env:PATH}"
          & $cmake -S . -B build-asan `
            -G "Visual Studio 17 2022" `
            -DCMAKE_BUILD_TYPE=Release `
            -DROUNDTABLE_BUILD_TESTS=ON `
            -DROUNDTABLE_ASAN=ON `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\third_party\qt\6.8.3\msvc2022_64"

      - name: Build test targets
        shell: pwsh
        run: |
          $cmake = Get-ChildItem "${{ github.workspace }}\tools\cmake\cmake-*\bin\cmake.exe" |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $cmake) { $cmake = "cmake" }
          $cmakeDir = Split-Path -Parent $cmake
          $env:PATH = "${cmakeDir};${env:PATH}"
          & $cmake --build build-asan --config Release --parallel

      - name: Run core tests under ASan
        shell: pwsh
        env:
          # Keep going past the first report so one leak doesn't mask the
          # rest of the suite; abort behaviour stays default (halt the test).
          ASAN_OPTIONS: "windows_hook_rtl_allocators=true"
        run: |
          $ctest = Get-ChildItem "${{ github.workspace }}\tools\cmake\cmake-*\bin\ctest.exe" |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $ctest) { $ctest = "ctest" }
          & $ctest --test-dir build-asan -C Release -L core --output-on-failure
